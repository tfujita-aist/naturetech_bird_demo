<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>鳥の声AI判定</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Yu Gothic", sans-serif;
      margin: 0;
      background: #0b1020;
      color: white;
      padding-bottom: 54px;
    }
    header {
      padding: 18px 36px;
      background: #12203a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
    }
    .title {
      font-size: 34px;
      font-weight: bold;
      line-height: 1.25;
      white-space: nowrap;
    }
    .header-logos {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 22px;
      flex-shrink: 0;
    }
    .logo-aist {
      width: 260px;
      height: auto;
      display: block;
    }
    .logo-nprc {
      width: 90px;
      height: auto;
      display: block;
    }
    main {
      padding: 36px;
    }
    .card {
      background: #17233f;
      border-radius: 24px;
      padding: 36px;
      min-height: 520px;
      box-sizing: border-box;
    }
    .button-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }
    button {
      font-size: 24px;
      border: 0;
      border-radius: 14px;
      padding: 16px 24px;
      margin: 0;
      cursor: pointer;
      color: white;
      font-weight: bold;
      background: #2d3d66;
      transition: transform 0.08s, background 0.15s, opacity 0.15s;
    }
    button:hover {
      transform: translateY(-1px);
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }
    button.active {
      background: #4f8cff;
      box-shadow: 0 0 0 3px rgba(79, 140, 255, 0.25);
    }
    button.inactive {
      background: #2d3d66;
      box-shadow: none;
    }
    .big {
      font-size: 72px;
      font-weight: bold;
      margin: 24px 0;
      line-height: 1.18;
    }
    .sub {
      font-size: 30px;
      opacity: 0.9;
      line-height: 1.4;
    }
    .small {
      font-size: 20px;
      opacity: 0.75;
      line-height: 1.5;
    }
    .meter-label {
      font-size: 28px;
      opacity: 0.95;
      font-weight: bold;
      margin-top: 20px;
    }
    .meter {
      width: 100%;
      height: 30px;
      background: #081022;
      border-radius: 999px;
      overflow: hidden;
      margin: 14px 0 24px 0;
    }
    .bar {
      height: 100%;
      width: 0%;
      background: #70d87b;
    }
    .wave-card {
      margin: 24px 0 0 0;
      background: #081022;
      border-radius: 18px;
      padding: 20px;
      width: 100%;
      box-sizing: border-box;
    }
    .wave-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 12px;
    }
    .wave-title {
      font-size: 34px;
      font-weight: bold;
      line-height: 1.2;
    }
    .wave-status {
      font-size: 20px;
      opacity: 0.84;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      white-space: nowrap;
    }
    .wave-wrap {
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
      background: #020617;
      border: 1px solid rgba(148, 163, 184, 0.25);
      box-sizing: border-box;
    }
    canvas#wave_canvas {
      width: 100%;
      height: 380px;
      background: #020617;
      display: block;
    }
    .result-panel {
      background: rgba(0,0,0,0.14);
      border-radius: 20px;
      padding: 28px;
      margin-top: 24px;
      box-sizing: border-box;
      min-height: 260px;
    }
    .candidate-list {
      margin-top: 18px;
      font-size: 22px;
      line-height: 1.6;
      opacity: 0.88;
    }
    .status-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;
      background: rgba(8, 16, 34, 0.96);
      border-top: 1px solid rgba(148, 163, 184, 0.25);
      color: rgba(226, 232, 240, 0.86);
      font-size: 15px;
      line-height: 1.45;
      padding: 8px 16px;
      box-sizing: border-box;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 900px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }
      .title {
        white-space: normal;
      }
      .header-logos {
        justify-content: flex-start;
      }
      .logo-aist {
        width: 220px;
      }
      .logo-nprc {
        width: 76px;
      }
      main {
        padding: 24px;
      }
      .card {
        padding: 28px;
      }
      .big {
        font-size: 56px;
      }
      .sub {
        font-size: 24px;
      }
      .wave-header {
        align-items: flex-start;
        flex-direction: column;
      }
      .wave-status {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
<header>
  <div class="title">鳥の声AI判定 / BirdNET</div>
  <div class="header-logos">
    <img class="logo-aist" src="/static/logos/aist_vision_logo_jp_rw.png" alt="産総研">
    <img class="logo-nprc" src="/static/logos/aist_nprc_logo_rw_bkw.png" alt="ネイチャーポジティブ技術実装センター">
  </div>
</header>

<main>
  <div class="card">
    <div class="button-row">
      <button id="birdnet_start_btn" class="active" onclick="startBirdnet()">開始</button>
      <button id="birdnet_stop_btn" class="inactive" onclick="stopBirdnet()">停止</button>
    </div>

    <div class="meter-label">CH1 / UMG15B 音量</div>
    <div class="meter"><div id="bar1" class="bar"></div></div>

    <div class="wave-card">
      <div class="wave-header">
        <div class="wave-title">入力音声の波形</div>
        <div id="wave_status" class="wave-status">waveform: loading...</div>
      </div>
      <div class="wave-wrap">
        <canvas id="wave_canvas"></canvas>
      </div>
    </div>

    <div id="area" class="result-panel">
      <div class="big">停止中</div>
      <div class="sub">開始を押してください</div>
    </div>
  </div>
</main>

<div id="status" class="status-bar">Status: loading...</div>

<script>
const WAVEFORM_SECONDS = 3.0;
const WAVEFORM_MAX_POINTS = 600;

let lastWaveformSamples = [];

function pct(x) {
  return Math.min(100, Math.max(0, x * 1000));
}

function birdName(item) {
  return item.display_name || item.japanese_name || item.common_name || item.scientific_name || "";
}

function setStartStopButtons(startId, stopId, isRunning) {
  const startBtn = document.getElementById(startId);
  const stopBtn = document.getElementById(stopId);

  if (!startBtn || !stopBtn) return;

  if (isRunning) {
    startBtn.classList.remove("active");
    startBtn.classList.add("inactive");

    stopBtn.classList.remove("inactive");
    stopBtn.classList.add("active");
  } else {
    startBtn.classList.remove("inactive");
    startBtn.classList.add("active");

    stopBtn.classList.remove("active");
    stopBtn.classList.add("inactive");
  }
}

function resizeWaveCanvas() {
  const canvas = document.getElementById("wave_canvas");
  if (!canvas) return;

  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;

  const newWidth = Math.max(700, Math.floor(rect.width * dpr));
  const newHeight = Math.max(340, Math.floor(rect.height * dpr));

  if (canvas.width !== newWidth || canvas.height !== newHeight) {
    canvas.width = newWidth;
    canvas.height = newHeight;
  }
}

function drawWaveform(samples, message = "") {
  const canvas = document.getElementById("wave_canvas");
  if (!canvas) return;

  resizeWaveCanvas();

  const ctx = canvas.getContext("2d");
  const w = canvas.width;
  const h = canvas.height;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "#020617";
  ctx.fillRect(0, 0, w, h);

  const dpr = window.devicePixelRatio || 1;

  const axisLabelX = 34 * dpr;
  const plotLeft = Math.floor(132 * dpr);
  const plotRight = Math.floor(w - 22 * dpr);
  const plotTop = Math.floor(38 * dpr);
  const plotBottom = Math.floor(h - 76 * dpr);

  const plotW = plotRight - plotLeft;
  const plotH = plotBottom - plotTop;
  const midY = plotTop + plotH / 2;

  drawWaveAxes(ctx, {
    h,
    plotLeft,
    plotRight,
    plotTop,
    plotBottom,
    midY,
    seconds: WAVEFORM_SECONDS,
  });

  if (!samples || samples.length === 0) {
    drawOverlayMessage(ctx, message || "入力音声を待っています", plotLeft, plotRight, plotTop, plotBottom);
    return;
  }

  ctx.save();

  ctx.strokeStyle = "#70d87b";
  ctx.lineWidth = Math.max(2.2, h * 0.0065);
  ctx.globalAlpha = 0.95;

  ctx.beginPath();

  const n = samples.length;
  const amp = plotH * 0.48;

  for (let i = 0; i < n; i++) {
    const x = plotLeft + (i / Math.max(1, n - 1)) * plotW;
    let v = Number(samples[i] || 0);

    if (!Number.isFinite(v)) {
      v = 0;
    }

    v = Math.max(-1, Math.min(1, v));
    v = Math.tanh(v * 2.2);

    const y = midY - v * amp;

    if (i === 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }
  }

  ctx.stroke();

  ctx.restore();
}

function drawWaveAxes(ctx, p) {
  const {
    h,
    plotLeft,
    plotRight,
    plotTop,
    plotBottom,
    midY,
    seconds,
  } = p;

  const dpr = window.devicePixelRatio || 1;

  const plotW = plotRight - plotLeft;
  const plotH = plotBottom - plotTop;

  ctx.fillStyle = "#020617";
  ctx.fillRect(plotLeft, plotTop, plotW, plotH);

  const tickFont = `${Math.max(18, h * 0.060)}px system-ui, -apple-system, BlinkMacSystemFont, sans-serif`;
  const labelFont = `bold ${Math.max(21, h * 0.070)}px system-ui, -apple-system, BlinkMacSystemFont, sans-serif`;

  const ampTicks = [-1.0, -0.5, 0.0, 0.5, 1.0];

  for (const amp of ampTicks) {
    const y = midY - amp * (plotH / 2);

    ctx.strokeStyle = "rgba(148, 163, 184, 0.16)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(plotLeft, y);
    ctx.lineTo(plotRight, y);
    ctx.stroke();

    ctx.fillStyle = "rgba(226, 232, 240, 0.78)";
    ctx.font = tickFont;
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillText(amp.toFixed(1), plotLeft - 24 * dpr, y);
  }

  const secMax = Math.max(1, seconds || 3.0);
  const secTicks = Math.floor(secMax);

  for (let i = 0; i <= secTicks; i++) {
    const x = plotLeft + plotW * (i / secMax);

    ctx.strokeStyle = "rgba(148, 163, 184, 0.16)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, plotTop);
    ctx.lineTo(x, plotBottom);
    ctx.stroke();

    ctx.fillStyle = "rgba(226, 232, 240, 0.78)";
    ctx.font = tickFont;
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillText(`${i}s`, x, plotBottom + 10);
  }

  ctx.strokeStyle = "rgba(226, 232, 240, 0.45)";
  ctx.lineWidth = 1.8;
  ctx.strokeRect(plotLeft, plotTop, plotW, plotH);

  ctx.fillStyle = "rgba(226, 232, 240, 0.88)";
  ctx.font = labelFont;

  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  ctx.fillText("時間（秒）", plotLeft + plotW / 2, plotBottom + 36 * dpr);

  ctx.save();
  ctx.translate(34 * dpr, plotTop + plotH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("振幅", 0, 0);
  ctx.restore();

  ctx.strokeStyle = "rgba(226, 232, 240, 0.55)";
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(plotLeft, midY);
  ctx.lineTo(plotRight, midY);
  ctx.stroke();
}

function drawOverlayMessage(ctx, message, plotLeft, plotRight, plotTop, plotBottom) {
  const plotW = plotRight - plotLeft;
  const plotH = plotBottom - plotTop;
  const cx = plotLeft + plotW / 2;
  const cy = plotTop + plotH * 0.42;

  const fontSize = Math.max(26, ctx.canvas.height * 0.085);
  ctx.font = `bold ${fontSize}px system-ui, -apple-system, BlinkMacSystemFont, sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  const metrics = ctx.measureText(message);
  const padX = fontSize * 0.85;
  const padY = fontSize * 0.45;
  const boxW = metrics.width + padX * 2;
  const boxH = fontSize + padY * 2;
  const x = cx - boxW / 2;
  const y = cy - boxH / 2;

  ctx.save();
  ctx.globalAlpha = 0.92;
  ctx.fillStyle = "#020617";
  roundRect(ctx, x, y, boxW, boxH, 18);
  ctx.fill();

  ctx.globalAlpha = 1.0;
  ctx.strokeStyle = "rgba(112, 216, 123, 0.65)";
  ctx.lineWidth = 3;
  roundRect(ctx, x, y, boxW, boxH, 18);
  ctx.stroke();

  ctx.fillStyle = "#70d87b";
  ctx.fillText(message, cx, cy);
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr);
  ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

async function refreshWaveform() {
  try {
    const r = await fetch(
      `/api/audio/waveform/birdnet?seconds=${WAVEFORM_SECONDS}&max_points=${WAVEFORM_MAX_POINTS}`,
      {cache: "no-store"}
    );

    const data = await r.json();

    if (!r.ok || data.error) {
      document.getElementById("wave_status").textContent =
        `waveform error: ${data.error || r.status}`;
      drawWaveform(lastWaveformSamples, "波形を取得できません");
      return;
    }

    lastWaveformSamples = data.samples || [];

    document.getElementById("wave_status").textContent =
      `CH${Number(data.channel || 0) + 1} / peak=${Number(data.peak || 0).toFixed(4)} / rms=${Number(data.rms || 0).toFixed(4)}`;

    drawWaveform(lastWaveformSamples);

  } catch (e) {
    document.getElementById("wave_status").textContent =
      `waveform error: ${e.message}`;
    drawWaveform(lastWaveformSamples, "波形を取得できません");
  }
}

async function startBirdnet() {
  await fetch("/api/birdnet/start", {method: "POST"});
  await refreshState();
}

async function stopBirdnet() {
  await fetch("/api/birdnet/stop", {method: "POST"});
  await refreshState();
}

function renderStopped(det) {
  if (det && det.top && det.top.length > 0) {
    const top = det.top[0];
    const name = birdName(top);
    const conf = Math.round(top.confidence * 100);

    document.getElementById("area").innerHTML = `
      <div class="sub">停止中 / 最後の判定結果</div>
      <div class="big">${name}</div>
      <div class="sub">AIの自信度：${conf}%</div>
      <div class="small">${top.scientific_name || ""} / ${top.common_name || ""}</div>
    `;
    return;
  }

  document.getElementById("area").innerHTML = `
    <div class="big">停止中</div>
    <div class="sub">開始を押してください</div>
  `;
}

function renderDetecting() {
  document.getElementById("area").innerHTML = `
    <div class="big">判定中</div>
    <div class="sub">鳥の声を待っています</div>
  `;
}

function renderDetection(det) {
  if (!det) {
    renderDetecting();
    return;
  }

  if (det.top && det.top.length > 0) {
    const top = det.top[0];
    const name = birdName(top);
    const conf = Math.round(top.confidence * 100);

    let html = `
      <div class="sub">${det.time || ""}</div>
      <div class="big">${name}</div>
      <div class="sub">AIの自信度：${conf}%</div>
      <div class="small">${top.scientific_name || ""} / ${top.common_name || ""}</div>
    `;

    if (det.top.length > 1) {
      html += `<div class="candidate-list">ほかの候補：`;
      for (let i = 1; i < det.top.length; i++) {
        const item = det.top[i];
        html += `${birdName(item)} ${Math.round(item.confidence * 100)}%`;
        if (i < det.top.length - 1) {
          html += ` / `;
        }
      }
      html += `</div>`;
    }

    document.getElementById("area").innerHTML = html;
    return;
  }

  if (det.message) {
    document.getElementById("area").innerHTML = `
      <div class="sub">${det.time || ""}</div>
      <div class="big">${det.message}</div>
    `;
    return;
  }

  renderDetecting();
}

async function refreshState() {
  try {
    const r = await fetch("/api/state");
    const s = await r.json();

    document.getElementById("bar1").style.width = pct(s.audio.level_ch1) + "%";

    setStartStopButtons(
      "birdnet_start_btn",
      "birdnet_stop_btn",
      Boolean(s.birdnet.running)
    );

    document.getElementById("status").textContent =
      `Status: ${s.birdnet.status} / running=${s.birdnet.running} | ` +
      `capture=${s.birdnet.capture_status || ""} | ` +
      `analyze=${s.birdnet.analyze_status || ""} | ` +
      `elapsed=${s.birdnet.last_elapsed_seconds ?? "-"} s | ` +
      `audio=${s.audio.status} | CH1=${Number(s.audio.level_ch1 || 0).toFixed(5)}`;

    const b = s.birdnet;
    const det = b.latest_detection;

    if (!b.running) {
      renderStopped(det);
      return;
    }

    renderDetection(det);

  } catch (e) {
    document.getElementById("status").textContent =
      `Status error: ${e.message}`;

    document.getElementById("area").innerHTML = `
      <div class="big">エラー</div>
      <div class="sub">${e.message}</div>
    `;
  }
}

window.addEventListener("resize", () => {
  drawWaveform(lastWaveformSamples);
});

drawWaveform([], "入力音声を待っています");

setInterval(refreshState, 500);
setInterval(refreshWaveform, 1000);

refreshState();
refreshWaveform();
</script>
</body>
</html>
