<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{{ config.ui.title }}</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Yu Gothic", sans-serif;
      margin: 0;
      background: #0b1020;
      color: white;
      padding-bottom: 54px;
    }
    header {
      padding: 28px 36px 20px 36px;
      background: #12203a;
    }
    .title {
      font-size: 34px;
      font-weight: bold;
      line-height: 1.25;
    }
    main {
      padding: 28px;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
      gap: 24px;
      align-items: stretch;
    }
    .card {
      background: #17233f;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      box-sizing: border-box;
    }
    .section-title {
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 18px;
      color: #ffd166;
    }
    .launcher-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }
    .launcher-button {
      display: block;
      text-decoration: none;
      color: white;
      background: #4f8cff;
      border-radius: 22px;
      padding: 28px 30px;
      font-size: 30px;
      font-weight: bold;
      line-height: 1.3;
      box-shadow: 0 0 0 4px rgba(79, 140, 255, 0.22);
      transition: transform 0.08s, background 0.15s, opacity 0.15s;
      border: 0;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      width: 100%;
      box-sizing: border-box;
    }
    .launcher-button:hover {
      transform: translateY(-1px);
      background: #6ea2ff;
    }
    .launcher-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .launcher-sub {
      display: block;
      font-size: 18px;
      font-weight: normal;
      opacity: 0.86;
      margin-top: 6px;
    }
    .reset-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 28px;
    }
    .reset-button {
      border: 0;
      border-radius: 18px;
      padding: 20px 18px;
      font-size: 22px;
      font-weight: bold;
      color: white;
      background: #2d3d66;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.08s, background 0.15s, opacity 0.15s;
    }
    .reset-button:hover {
      transform: translateY(-1px);
      background: #4f8cff;
    }
    .reset-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .qr-panel {
      text-align: center;
    }
    .qr-title {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 14px;
      color: #ffd166;
    }
    .qr-panel img {
      display: block;
      width: 220px;
      height: 220px;
      margin: 0 auto 14px auto;
      background: white;
      border-radius: 14px;
      padding: 10px;
      box-sizing: border-box;
    }
    .qr-url {
      font-size: 14px;
      line-height: 1.35;
      opacity: 0.86;
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .status-box {
      margin-top: 22px;
      background: rgba(0,0,0,0.18);
      border-radius: 16px;
      padding: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 16px;
      line-height: 1.65;
      color: rgba(226, 232, 240, 0.9);
      word-break: break-all;
      text-align: left;
    }
    .status-message {
      margin-top: 18px;
      font-size: 18px;
      line-height: 1.45;
      color: rgba(226, 232, 240, 0.9);
      min-height: 26px;
    }
    .status-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;
      background: rgba(8, 16, 34, 0.96);
      border-top: 1px solid rgba(148, 163, 184, 0.25);
      color: rgba(226, 232, 240, 0.86);
      font-size: 15px;
      line-height: 1.45;
      padding: 8px 16px;
      box-sizing: border-box;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 960px) {
      main {
        grid-template-columns: 1fr;
      }
      .launcher-button {
        font-size: 26px;
      }
      .reset-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
<header>
  <div class="title">{{ config.ui.title }}</div>
</header>

<main>
  <section class="card">
    <div class="section-title">画面を開く</div>

    <div class="launcher-grid">
      <a class="launcher-button" href="/birdnet">
        鳥の声AI判定を開く
        <span class="launcher-sub">BirdNET による鳥の声のリアルタイム判定</span>
      </a>

      <a class="launcher-button" href="/mimic">
        鳥の鳴きまねチャレンジを開く
        <span class="launcher-sub">お手本を聞いて、鳴きまねを採点</span>
      </a>

      <a class="launcher-button" href="/control">
        操作パネルを開く
        <span class="launcher-sub">スマートフォン、タブレット、別PCなどから操作</span>
      </a>
    </div>

    <div class="section-title" style="margin-top:34px;">リセット</div>

    <div class="reset-grid">
      <button id="birdnet_reset_btn" class="reset-button" onclick="resetBirdnet()">
        鳥の声AI判定をリセットする
      </button>

      <button id="mimic_reset_btn" class="reset-button" onclick="resetMimic()">
        鳥の鳴きまねチャレンジをリセットする
      </button>
    </div>

    <div id="reset_message" class="status-message"></div>
  </section>

  <section class="card qr-panel">
    <div class="qr-title">操作パネル</div>
    <img src="{{ control_qr_url }}?t={{ control_url }}" alt="操作パネルQRコード">
    <div class="qr-url">{{ control_url }}</div>

    <div id="status_box" class="status-box">
      Status: loading...
    </div>
  </section>
</main>

<div id="status_bar" class="status-bar">Status: loading...</div>

<script>
function formatBool(value) {
  return value ? "true" : "false";
}

function setResetMessage(message) {
  document.getElementById("reset_message").textContent = message;
}

async function resetBirdnet() {
  const btn = document.getElementById("birdnet_reset_btn");
  btn.disabled = true;
  setResetMessage("鳥の声AI判定をリセットしています...");

  try {
    const r = await fetch("/api/birdnet/reset", {method: "POST"});
    const data = await r.json();

    if (!r.ok || data.error) {
      setResetMessage(data.error || "鳥の声AI判定のリセットに失敗しました。");
      return;
    }

    setResetMessage("鳥の声AI判定をリセットしました。");
    await refreshState();

  } catch (e) {
    setResetMessage(`鳥の声AI判定のリセットに失敗しました: ${e.message}`);

  } finally {
    btn.disabled = false;
  }
}

async function resetMimic() {
  const btn = document.getElementById("mimic_reset_btn");
  btn.disabled = true;
  setResetMessage("鳥の鳴きまねチャレンジをリセットしています...");

  try {
    const r = await fetch("/api/mimic/reset", {method: "POST"});
    const data = await r.json();

    if (!r.ok || data.error) {
      setResetMessage(data.error || "鳥の鳴きまねチャレンジのリセットに失敗しました。");
      return;
    }

    setResetMessage("鳥の鳴きまねチャレンジをリセットしました。");
    await refreshState();

  } catch (e) {
    setResetMessage(`鳥の鳴きまねチャレンジのリセットに失敗しました: ${e.message}`);

  } finally {
    btn.disabled = false;
  }
}

async function refreshState() {
  try {
    const r = await fetch("/api/state");
    const s = await r.json();

    const activeSpecies =
      (s.control && s.control.active_species_key) ||
      (s.mimic && s.mimic.active_species_key) ||
      "-";

    const command =
      s.control && s.control.mimic_command
        ? `${s.control.mimic_command.species_key} / id=${s.control.mimic_command.id}`
        : "-";

    document.getElementById("status_box").innerHTML =
      `Audio: ${s.audio.status}<br>` +
      `CH1: ${Number(s.audio.level_ch1 || 0).toFixed(5)} / ` +
      `CH2: ${Number(s.audio.level_ch2 || 0).toFixed(5)}<br>` +
      `BirdNET: ${s.birdnet.status} / running=${formatBool(s.birdnet.running)}<br>` +
      `Mimic: ${s.mimic.status} / running=${formatBool(s.mimic.running)}<br>` +
      `Species: ${activeSpecies}<br>` +
      `Command: ${command}`;

    document.getElementById("status_bar").textContent =
      `Status: Audio=${s.audio.status} | ` +
      `BirdNET=${s.birdnet.status} running=${formatBool(s.birdnet.running)} | ` +
      `Mimic=${s.mimic.status} running=${formatBool(s.mimic.running)} | ` +
      `species=${activeSpecies}`;

  } catch (e) {
    document.getElementById("status_box").textContent =
      `Status error: ${e.message}`;
    document.getElementById("status_bar").textContent =
      `Status error: ${e.message}`;
  }
}

setInterval(refreshState, 500);
refreshState();
</script>
</body>
</html>
